<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预订服务 - 婺源风景区</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>婺源风景区</h1>
        <nav>
            <ul>
                <li><a href="index.html">主页</a></li>
                <li><a href="attractions.html">景点介绍</a></li>
                <li><a href="guide.html">旅游攻略</a></li>
                <li><a href="booking.html">预订服务</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="booking">
            <h2>预订服务</h2>
            <form>
                <label for="name">姓名:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="date">日期:</label>
                <input type="date" id="date" name="date" required>
                
                <label for="people">人数:</label>
                <input type="number" id="people" name="people" min="1" required>
                
                <button type="submit">提交预订</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 婺源风景区. 保留所有权利.</p>
    </footer>
</body>

<style>
    /* 重置浏览器默认样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* 基础字体和背景设置 */
body {
    font-family: 'Arial', sans-serif;
    color: #333;
    background-color: #f9f9f9;
    line-height: 1.6;
}

/* 头部样式 */
header {
    background-color: #4CAF50;
    color: white;
    padding: 10px 0;
    text-align: center;
}

header h1 {
    display: inline-block;
    font-size: 2em;
}

nav ul {
    list-style-type: none;
    padding: 0;
}

nav ul li {
    display: inline;
    margin: 0 15px;
}

nav ul li a {
    color: white;
    text-decoration: none;
    transition: color 0.3s ease;
}

nav ul li a:hover {
    color: #ddd;
}

/* 主体内容样式 */
main {
    padding: 20px;
    margin: 10px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.banner img {
    width: 100%;
    height: auto;
    border-radius: 8px;
}

.highlights {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
}

.highlights img {
    width: 30%;
    margin: 10px;
    border-radius: 8px;
}

.attractions .attraction {
    margin-bottom: 20px;
}

.attractions .attraction h3 {
    margin-bottom: 10px;
}

.attractions .attraction p {
    margin-top: 10px;
}

/* 表单样式 */
form {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

form label {
    margin-bottom: 5px;
}

form input,
form button {
    margin-bottom: 20px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    width: 100%;
}

form button {
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

form button:hover {
    background-color: #45a049;
}

/* 页脚样式 */
footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 10px 0;
    position: relative;
    bottom: 0;
    width: 100%;
}

/* 响应式设计 */
@media (max-width: 768px) {
    nav ul li {
        display: block;
        text-align: center;
        margin: 10px 0;
    }

    .highlights img {
        width: 100%;
    }
}
</style>

</html>
