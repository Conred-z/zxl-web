<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 婺源风景区</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>婺源风景区</h1>
        <nav>
            <ul>
                <li><a href="index.html">主页</a></li>
                <li><a href="attractions.html">景点介绍</a></li>
                <li><a href="guide.html">旅游攻略</a></li>
                <li><a href="booking.html">预订服务</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact">
            <h2>联系我们</h2>
            <p>电话: 123-4567-8901</p>
            <p>邮箱: info@wuyuan.com</p>
            <p>地址: 江西省婺源县</p>
        </section>
        <section class="contact-form">
            <h2>在线留言</h2>
            <form action="/submit-form" method="post">
                <label for="name">姓名:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">邮箱:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">留言:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">提交</button>
            </form>
        </section>
        <section class="contact-map">
            <h2>地图位置</h2>
            <img src="assets/ditu.jpg" alt="ditu" class="img">
        </section>
    </main>
    <footer>
        <p>&copy; 2024 婺源风景区. 保留所有权利.</p>
    </footer>
</body>

<style>
    .img{
    width: 2000px;
    height: 1000px;
}
    /* 重置浏览器默认样式 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* 基础字体和背景设置 */
    body {
        font-family: 'Arial', sans-serif;
        color: #333;
        background-color: #f9f9f9;
        line-height: 1.6;
    }

    /* 头部样式 */
    header {
        background-color: #4CAF50;
        color: white;
        padding: 10px 0;
        text-align: center;
    }

    header h1 {
        display: inline-block;
        font-size: 2em;
    }

    nav ul {
        list-style-type: none;
        padding: 0;
    }

    nav ul li {
        display: inline;
        margin: 0 15px;
    }

    nav ul li a {
        color: white;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    nav ul li a:hover {
        color: #ddd;
    }

    /* 主体内容样式 */
    main {
        padding: 20px;
        margin: 10px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .contact-form {
        margin-top: 20px;
    }

    .contact-form h2 {
        margin-bottom: 10px;
    }

    .contact-form form {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
    }

    .contact-form form label {
        margin-bottom: 5px;
    }

    .contact-form form input,
    .contact-form form textarea {
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        width: 100%;
    }

    .contact-form form button {
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
    }

    .contact-form form button:hover {
        background-color: #45a049;
    }

    .contact-map {
        margin-top: 20px;
    }

    .contact-map h2 {
        margin-bottom: 10px;
    }

    .contact-map iframe {
        border-radius: 8px;
    }

    /* 页脚样式 */
    footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 10px 0;
        position: relative;
        bottom: 0;
        width: 100%;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
        nav ul li {
            display: block;
            text-align: center;
            margin: 10px 0;
        }

        .contact-form form {
            width: 100%;
        }

        .contact-map iframe {
            height: 250px;
        }
    }
</style>
</html>
